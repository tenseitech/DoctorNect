name: Audit closure — quality & Docker gates

on:
  workflow_dispatch:
  push:
    branches:
      - 'audit-closure/**'
      - 'audit8/**'
      - 'audit9/**'
    paths:
      - '**'
  pull_request:
    branches: [main, master, staging]
    paths:
      - 'frontend/**'
      - 'backend/functions/**'
      - 'services/api-gateway/**'
      - 'scripts/**'
      - '.env.example'
      - '.github/workflows/audit_closure_gates.yml'

jobs:
  env-parity:
    name: QA-03 env parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Root env parity script
        run: node scripts/check_env_parity.js
      - name: Functions env_parity.test.js
        working-directory: backend/functions
        run: |
          npm ci
          npm run test:env-parity

  gateway-tests:
    name: Gateway unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: services/api-gateway
      - run: npm test
        working-directory: services/api-gateway
      - run: npm audit --omit=dev --audit-level=high
        working-directory: services/api-gateway

  gateway-docker-audit2:
    name: Audit 2 — Docker build & healthz
    runs-on: ubuntu-latest
    needs: [gateway-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Gateway Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/api-gateway/Dockerfile
          push: false
          load: true
          tags: doctornect/api-gateway:audit-closure
      - name: Audit 2 — Module resolution in image
        env:
          IMAGE: doctornect/api-gateway:audit-closure
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}" node -e "
            require('firebase-admin');
            require('ioredis');
            require('/app/scripts/lib/bootstrap_root_env');
            console.log('audit2-module-check-ok');
          "
      - name: Audit 2 — /healthz smoke
        env:
          IMAGE: doctornect/api-gateway:audit-closure
          DOCKER_NET: audit-closure-gw-net
        run: |
          set -euo pipefail
          docker network create "${DOCKER_NET}"
          docker run -d --name ac-mock-pgrst --network "${DOCKER_NET}" \
            hashicorp/http-echo:1.0.0 -listen=:3001 -text=ok
          docker run -d --name ac-gateway --network "${DOCKER_NET}" \
            -e NODE_ENV=development \
            -e APP_ENV=ci-audit-closure \
            -e PGRST_URL=http://ac-mock-pgrst:3001 \
            -e FIREBASE_REVOCATION_CHECK=false \
            -p 3000:3000 \
            "${IMAGE}"
          for _ in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/healthz | grep -q healthy; then
              curl -sf http://127.0.0.1:3000/livez
              exit 0
            fi
            sleep 1
          done
          docker logs ac-gateway
          exit 1
      - name: Docker cleanup
        if: always()
        run: |
          docker rm -f ac-gateway ac-mock-pgrst 2>/dev/null || true
          docker network rm audit-closure-gw-net 2>/dev/null || true

  flutter-regression:
    name: Flutter tests (closure)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: cp lib/firebase_options.secrets.example.dart lib/firebase_options.secrets.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: |
          flutter test test/audit9_accessible_icon_button_test.dart
          flutter test test/audit9_app_theme_accessibility_test.dart
          flutter test test/audit9_role_empty_state_test.dart
          flutter test test/audit_closure_app_colors_contrast_test.dart
          flutter test test/booking_in_flight_regression_test.dart
          flutter test test/auth_flows_test.dart
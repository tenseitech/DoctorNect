name: Supabase keepalive (backup)

on:
  schedule:
  # Every 2 days at 04:15 UTC (~09:45 IST)
    - cron: '15 4 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only ping (system_config)
        env:
          SUPABASE_KEEPALIVE_URL: ${{ secrets.SUPABASE_KEEPALIVE_URL }}
          SUPABASE_KEEPALIVE_KEY: ${{ secrets.SUPABASE_KEEPALIVE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_KEEPALIVE_URL:-}" ] || [ -z "${SUPABASE_KEEPALIVE_KEY:-}" ]; then
            echo "Missing SUPABASE_KEEPALIVE_URL or SUPABASE_KEEPALIVE_KEY repository secret"
            exit 1
          fi
          BASE="${SUPABASE_KEEPALIVE_URL%/}"
          TARGET="${BASE}/rest/v1/system_config?select=key&limit=1"
          HTTP_CODE=$(curl -sS -o /tmp/keepalive_body.txt -w "%{http_code}" \
            --max-time 15 \
            -H "apikey: ${SUPABASE_KEEPALIVE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEEPALIVE_KEY}" \
            -H "Accept: application/json" \
            "${TARGET}")
          echo "HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "supabase_keepalive_failed"
            head -c 200 /tmp/keepalive_body.txt || true
            exit 1
          fi
          echo "supabase_keepalive_ok"
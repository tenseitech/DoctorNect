name: Auth Gateway CI & Container Build

on:
  push:
    branches: [main, master, staging]
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/gateway_ci.yml'
  pull_request:
    branches: [main, master, staging]
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/gateway_ci.yml'

jobs:
  test-and-build:
    name: Test & Build Gateway Container
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Gateway dependencies
        working-directory: services/api-gateway
        run: npm ci

      - name: Run Gateway Unit & Security Tests
        working-directory: services/api-gateway
        run: npm test

      - name: Run NPM Security Audit
        working-directory: services/api-gateway
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/api-gateway/Dockerfile
          push: false
          load: true
          tags: |
            doctornect/api-gateway:latest
            doctornect/api-gateway:audit2-validation
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Audit 2 — In-image module resolution (DEP-09)
        env:
          IMAGE: doctornect/api-gateway:audit2-validation
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}" sh -c '
            test -f /app/scripts/lib/bootstrap_root_env.js
            test -f /app/scripts/lib/demo_routing.js
            test -f /app/scripts/lib/trusted_client_ip.js
            test -f /app/gateway/src/server.js
            test -d node_modules/firebase-admin
            test -d node_modules/ioredis
          '
          docker run --rm "${IMAGE}" node -e "
            require('firebase-admin');
            require('ioredis');
            require('/app/scripts/lib/bootstrap_root_env');
            require('/app/scripts/lib/demo_routing');
            require('/app/scripts/lib/trusted_client_ip');
            console.log('audit2-module-check-ok');
          "

      - name: Audit 2 — Container startup and /healthz (DEP-03/DEP-09)
        env:
          IMAGE: doctornect/api-gateway:audit2-validation
          DOCKER_NET: audit2-gateway-ci-net
        run: |
          set -euo pipefail
          docker network create "${DOCKER_NET}"
          docker run -d --name audit2-mock-pgrst --network "${DOCKER_NET}" \
            hashicorp/http-echo:1.0.0 -listen=:3001 -text=ok
          docker run -d --name audit2-gateway --network "${DOCKER_NET}" \
            -e NODE_ENV=development \
            -e APP_ENV=ci-audit2 \
            -e PGRST_URL=http://audit2-mock-pgrst:3001 \
            -e FIREBASE_REVOCATION_CHECK=false \
            -p 3000:3000 \
            "${IMAGE}"
          ok=0
          for _ in $(seq 1 45); do
            if curl -sf "http://127.0.0.1:3000/healthz" -o /tmp/audit2-healthz.json; then
              code="$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/healthz")"
              if [ "${code}" = "200" ] && grep -q '"status":"healthy"' /tmp/audit2-healthz.json; then
                ok=1
                break
              fi
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx audit2-gateway; then
              echo "Gateway container exited unexpectedly"
              docker logs audit2-gateway 2>&1 || true
              exit 1
            fi
            sleep 1
          done
          if [ "${ok}" -ne 1 ]; then
            echo "Audit 2 healthz smoke failed"
            docker logs audit2-gateway 2>&1 || true
            cat /tmp/audit2-healthz.json 2>/dev/null || true
            exit 1
          fi
          echo "audit2-healthz-ok"
          cat /tmp/audit2-healthz.json

      - name: Audit 2 — Docker runtime cleanup
        if: always()
        run: |
          docker rm -f audit2-gateway audit2-mock-pgrst 2>/dev/null || true
          docker network rm audit2-gateway-ci-net 2>/dev/null || true

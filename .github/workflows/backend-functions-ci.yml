name: Backend Functions CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/functions/**"
      - ".github/workflows/backend-functions-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/functions/**"
      - ".github/workflows/backend-functions-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: npm audit (production)
        run: npm audit --audit-level=high

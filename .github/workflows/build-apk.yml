name: Build APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/lib/**'
      - 'frontend/android/**'
      - 'frontend/pubspec.yaml'
      - 'frontend/pubspec.lock'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Prepare secrets file
        run: cp lib/firebase_options.secrets.example.dart lib/firebase_options.secrets.dart

      - run: flutter pub get
      # Debug build only: a release APK needs the Firebase / data-plane dart-defines and the
      # release keystore (scripts/release_build.ps1 / build_staging_demo_apk.ps1), never CI.
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk

# DoctorNect PostgREST Configuration
# Pinned version: 12.2.3
# Configuration parameters are injected via environment variables at runtime.

db-uri = "$(PGRST_DB_URI)"
db-schemas = "public"
db-anon-role = "anon"
db-pool = 10
db-pool-timeout = 10

# JWT Authentication
jwt-secret = "$(PGRST_JWT_SECRET)"
jwt-aud = "authenticated"
jwt-secret-is-base64 = false

# Server settings
server-host = "!4"
server-port = 3001

# Security & limits
max-rows = 1000


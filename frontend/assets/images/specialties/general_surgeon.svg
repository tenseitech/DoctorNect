<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="surgeonRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="scrubTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="scalpelMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <!-- Circular Blue Rim -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#surgeonRim)" stroke-width="26"/>
  <!-- Surgeon Head & Cap -->
  <ellipse cx="250" cy="240" rx="75" ry="85" fill="#FDBA74"/>
  <path d="M 175 220 C 175 140 325 140 325 220 Z" fill="url(#scrubTeal)"/>
  <!-- Surgical Mask -->
  <rect x="180" y="240" width="140" height="75" rx="20" fill="#38BDF8"/>
  <line x1="170" y1="260" x2="180" y2="260" stroke="#FFFFFF" stroke-width="4"/>
  <line x1="320" y1="260" x2="330" y2="260" stroke="#FFFFFF" stroke-width="4"/>
  <!-- Scrub Uniform Shoulders -->
  <path d="M 140 430 C 140 350 200 330 250 330 C 300 330 360 350 360 430 Z" fill="url(#scrubTeal)"/>
  <!-- Surgical Scalpel across front -->
  <g transform="rotate(-35 300 380)">
    <rect x="200" y="372" width="160" height="18" rx="8" fill="#0284C7"/>
    <path d="M 360 372 L 415 372 C 430 380 420 390 405 390 L 360 390 Z" fill="url(#scalpelMetal)"/>
  </g>
</svg>
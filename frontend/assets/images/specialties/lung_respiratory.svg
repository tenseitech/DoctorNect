<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lungBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="lungWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <!-- Circular Blue Badge -->
  <circle cx="250" cy="250" r="195" fill="url(#lungBadge)" stroke="#38BDF8" stroke-width="16"/>
  <!-- Left Lung -->
  <path d="M 230 200 C 200 160 150 200 140 260 C 130 330 170 385 220 370 C 235 365 235 280 230 200 Z" fill="url(#lungWhite)"/>
  <!-- Right Lung -->
  <path d="M 270 200 C 300 160 350 200 360 260 C 370 330 330 385 280 370 C 265 365 265 280 270 200 Z" fill="url(#lungWhite)"/>
  <!-- Trachea (windpipe) -->
  <rect x="238" y="110" width="24" height="120" rx="12" fill="#FFFFFF"/>
  <!-- Bronchial tree branches inside lungs -->
  <g fill="none" stroke="#0284C7" stroke-width="10" stroke-linecap="round">
    <path d="M 245 220 L 190 270 M 190 270 L 165 315 M 190 270 L 210 320"/>
    <path d="M 255 220 L 310 270 M 310 270 L 335 315 M 310 270 L 290 320"/>
  </g>
</svg>
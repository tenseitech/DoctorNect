<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eyeOutline" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
  </defs>
  <!-- Outer Eye Shape (Blue Frame) -->
  <path d="M 40 250 C 110 120 390 120 460 250 C 390 380 110 380 40 250 Z" fill="#FFFFFF" stroke="url(#eyeOutline)" stroke-width="36" stroke-linejoin="round"/>
  <!-- Blue Iris -->
  <circle cx="250" cy="250" r="95" fill="url(#irisGrad)"/>
  <!-- Iris radiating texture -->
  <circle cx="250" cy="250" r="80" fill="none" stroke="#0284C7" stroke-dasharray="4,6" stroke-width="4"/>
  <!-- Pupil -->
  <circle cx="250" cy="250" r="46" fill="#0F172A"/>
  <!-- Glossy White Highlight -->
  <circle cx="280" cy="225" r="18" fill="#FFFFFF"/>
</svg>
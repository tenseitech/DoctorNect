<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="childHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C3317"/>
      <stop offset="100%" stop-color="#381D0A"/>
    </linearGradient>
    <linearGradient id="childFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Blue shirt & arms -->
  <ellipse cx="250" cy="430" rx="140" ry="90" fill="url(#shirtGrad)"/>
  <!-- Little hands in front -->
  <ellipse cx="190" cy="420" rx="32" ry="25" fill="url(#childFace)"/>
  <ellipse cx="310" cy="420" rx="32" ry="25" fill="url(#childFace)"/>
  <!-- Ears -->
  <circle cx="150" cy="245" r="28" fill="url(#childFace)"/>
  <circle cx="350" cy="245" r="28" fill="url(#childFace)"/>
  <!-- Round Head -->
  <ellipse cx="250" cy="240" rx="108" ry="102" fill="url(#childFace)"/>
  <!-- Rosy cheeks -->
  <ellipse cx="190" cy="265" rx="20" ry="12" fill="#FB7185" opacity="0.6"/>
  <ellipse cx="310" cy="265" rx="20" ry="12" fill="#FB7185" opacity="0.6"/>
  <!-- Happy closed curve eyes -->
  <path d="M 195 235 Q 210 215 225 235" fill="none" stroke="#262626" stroke-width="7" stroke-linecap="round"/>
  <path d="M 275 235 Q 290 215 305 235" fill="none" stroke="#262626" stroke-width="7" stroke-linecap="round"/>
  <!-- Eyebrows -->
  <path d="M 195 205 Q 210 195 225 205" fill="none" stroke="#451A03" stroke-width="6" stroke-linecap="round"/>
  <path d="M 275 205 Q 290 195 305 205" fill="none" stroke="#451A03" stroke-width="6" stroke-linecap="round"/>
  <!-- Cute smile -->
  <path d="M 230 270 Q 250 295 270 270" fill="none" stroke="#262626" stroke-width="7" stroke-linecap="round"/>
  <!-- Boy Brown Hair with cute tuft -->
  <path d="M 148 220 C 138 120 200 80 250 80 C 310 80 365 120 352 220 C 340 160 310 135 270 135 C 230 135 210 150 180 180 C 160 170 150 200 148 220 Z" fill="url(#childHair)"/>
  <path d="M 250 80 C 275 55 305 60 295 85 Z" fill="url(#childHair)"/>

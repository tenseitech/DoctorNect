<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ribbonPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
  </defs>
  <!-- Awareness Ribbon (Purple loop and tails) -->
  <!-- Back / Left Loop -->
  <path d="M 250 80 C 180 80 150 160 210 240 L 130 380 L 190 410 L 250 300 Z" fill="url(#ribbonPurple)"/>
  <!-- Front / Right Overlapping Loop -->
  <path d="M 250 80 C 320 80 350 160 290 240 L 370 380 L 310 410 L 250 300 Z" fill="#7E22CE"/>
  <!-- Ribbon cutout inner oval -->
  <ellipse cx="250" cy="180" rx="35" ry="50" fill="#FFFFFF"/>
</svg>
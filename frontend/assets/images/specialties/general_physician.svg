<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4B91F7"/>
      <stop offset="100%" stop-color="#2162DE"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="diaphragmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3F4F6"/>
      <stop offset="50%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#4B91F7"/>
    </linearGradient>
  </defs>
  <!-- Binaural metal pipes -->
  <path d="M 180 140 C 180 80 205 50 225 50 C 240 50 245 75 245 100" fill="none" stroke="url(#metalGrad)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 320 140 C 320 80 295 50 275 50 C 260 50 255 75 255 100" fill="none" stroke="url(#metalGrad)" stroke-width="16" stroke-linecap="round"/>
  <!-- Ear tips -->
  <circle cx="225" cy="50" r="16" fill="#3B82F6"/>
  <circle cx="275" cy="50" r="16" fill="#3B82F6"/>
  <!-- Central connector -->
  <rect x="236" y="180" width="28" height="35" rx="8" fill="url(#metalGrad)"/>
  <!-- Flexible tubing -->
  <path d="M 180 135 C 180 210 238 220 238 230 C 238 290 170 330 170 380 C 170 435 245 470 300 420 C 350 375 330 280 370 270" fill="none" stroke="url(#tubeGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 320 135 C 320 210 262 220 262 230" fill="none" stroke="url(#tubeGrad)" stroke-width="32" stroke-linecap="round"/>
  <!-- Chestpiece / Diaphragm -->
  <g transform="translate(375, 270)">
    <circle cx="0" cy="0" r="58" fill="url(#tubeGrad)"/>
    <circle cx="0" cy="0" r="48" fill="url(#metalGrad)"/>
    <circle cx="0" cy="0" r="36" fill="url(#diaphragmGrad)"/>
    <circle cx="0" cy="0" r="12" fill="#2563EB"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="runnerBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Speed lines trailing behind -->
  <line x1="60" y1="180" x2="150" y2="180" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
  <line x1="50" y1="225" x2="140" y2="225" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  <line x1="70" y1="270" x2="180" y2="270" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <!-- Athletic Running Figure -->
  <!-- Head -->
  <circle cx="340" cy="120" r="48" fill="url(#runnerBlue)"/>
  <!-- Torso and Limbs -->
  <g fill="none" stroke="url(#runnerBlue)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back arm swinging forward -->
    <path d="M 230 195 L 180 220 L 195 270"/>
    <!-- Torso -->
    <path d="M 315 170 L 255 285 L 295 330"/>
    <!-- Front arm pumping -->
    <path d="M 285 190 L 360 255 L 415 210"/>
    <!-- Front bent knee & leg -->
    <path d="M 255 285 L 345 350 L 295 440"/>
    <!-- Back trailing leg -->
    <path d="M 255 285 L 175 365 L 105 410"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="stomachGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="60%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="arrowGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <!-- Circular green digestive flow arrows -->
  <path d="M 120 280 C 90 200 130 110 210 80" fill="none" stroke="url(#arrowGreen)" stroke-width="18" stroke-linecap="round"/>
  <polygon points="110,290 135,275 105,260" fill="#16A34A"/>
  <path d="M 380 220 C 410 300 370 390 290 420" fill="none" stroke="url(#arrowGreen)" stroke-width="18" stroke-linecap="round"/>
  <polygon points="390,210 365,225 395,240" fill="#16A34A"/>
  <!-- Esophagus Pipe -->
  <path d="M 235 55 L 265 55 L 265 140 L 235 140 Z" fill="url(#stomachGrad)"/>
  <!-- Stomach Main Sac -->
  <path d="M 245 125 C 310 120 370 170 370 250 C 370 330 270 345 220 310 C 180 280 210 205 245 125 Z" fill="url(#stomachGrad)"/>
  <!-- Golden gastric window/core -->
  <path d="M 250 185 C 310 190 325 240 310 275 C 270 295 240 250 250 185 Z" fill="#FBBF24" opacity="0.85"/>
  <!-- Intestines (folded loops below) -->
  <path d="M 215 315 C 215 345 170 350 170 370 C 170 390 270 390 270 410 C 270 430 190 440 210 460" fill="none" stroke="url(#stomachGrad)" stroke-width="24" stroke-linecap="round"/>
</svg>
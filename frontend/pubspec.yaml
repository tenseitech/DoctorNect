name: medibond
description: DoctorNect - Your Health, Our Priority
publish_to: 'none'
version: 1.0.2+7
environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^11.0.2
  image_picker: ^1.2.2
  image_picker_android: ^0.8.13+19
  image_picker_platform_interface: ^2.11.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  flutter_slidable: ^4.0.3
  fl_chart: ^1.2.0
  url_launcher: ^6.3.1
  firebase_core: ^4.14.0
  supabase_flutter: ^2.8.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  firebase_storage: ^13.5.0
  firebase_messaging: ^16.6.0
  firebase_app_check: ^0.4.7
  flutter_local_notifications: ^19.5.0
  archive: ^4.0.4
  pdf: ^3.11.3
  printing: ^5.14.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  crypto: ^3.0.6
  share_plus: ^10.1.0
  screenshot: ^3.0.0
  encrypt: ^5.0.3
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^6.2.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  http: ^1.2.2
  razorpay_flutter: ^1.3.7

  timezone: any
  flutter_native_splash: ^2.4.0
  firebase_remote_config: ^6.7.0
  cached_network_image: ^3.4.1
  pinput: 5.0.0
  smart_auth: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^4.2.0

# Icon-only mark (no wordmark) for crisp launcher/favicon at small sizes.
# Master full logo (icon + DoctorNect text) lives at assets/images/logo.webp.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1D4ED8"
  adaptive_icon_foreground: "assets/images/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/images/adaptive_monochrome.png"
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#1D4ED8"
    theme_color: "#1D4ED8"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo_splash.png"
  color_dark: "#FFFFFF"
  image_dark: "assets/images/logo_splash.png"
  android: true
  ios: true
  web: false
  # Android 12+: larger mark (~78% canvas) for circular viewport prominence
  android_12:
    image: "assets/images/logo_splash_android12.png"
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo_mark_transparent.png
    - assets/images/specialties/
    - assets/images/services/
    - assets/data/indian_medicines.txt.gz
    - assets/data/icd10_diagnoses.txt.gz
    - assets/data/symptoms.json
    - assets/data/symptom_lists.json
    - assets/icons/doctor/
    - assets/icons/common/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-Italic.ttf
          weight: 400
          style: italic
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700



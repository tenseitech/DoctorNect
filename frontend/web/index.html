<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DoctorNect — book doctors, manage appointments, health records. Web, Android & iOS.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

  <!-- Preconnect to critical domains used by DoctorNect Web -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
  <link rel="preconnect" href="https://securetoken.googleapis.com">
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">

  <!-- Preload bootstrap script in parallel with head resources -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DoctorNect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DoctorNect</title>
  <link rel="manifest" href="manifest.json">
  <meta name="google-signin-client_id" content="658118593597-8k252ss5k33jknhqchgui8djnp91fjdg.apps.googleusercontent.com">

  <!-- Force HTTPS in production (non-critical, defer) -->
  <script defer src="scripts/force-https.js"></script>

  <!-- Preload Firebase SDKs as ES modules (no inline scripts; see firebase-sdk-loader.js). -->
  <script type="module" src="scripts/firebase-sdk-loader.js"></script>

  <!-- Self-hosted pdf.js for printing/PdfPreview on web (non-critical, defer) -->
  <script defer src="scripts/pdfjs-config.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #dn-web-loader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FFFFFF;
      z-index: 99999;
      transition: opacity 0.25s ease-out;
      pointer-events: none;
    }
    .dn-spinner {
      width: 40px;
      height: 40px;
      border: 3.5px solid #E2E8F0;
      border-top-color: #0D9488;
      border-radius: 50%;
      animation: dn-spin 0.8s linear infinite;
    }
    @keyframes dn-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="dn-web-loader">
    <div class="dn-spinner"></div>
  </div>
  <script>
    (function () {
      function removeLoader() {
        var loader = document.getElementById('dn-web-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function () {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 260);
        }
      }
      var observer = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          removeLoader();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      window.addEventListener('flutter-first-frame', removeLoader);
    })();
  </script>
  <script src="scripts/splash-bootstrap.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 833" width="100%" height="100%">
  <defs>
    <linearGradient id="crossGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="100%" stop-color="#D60007"/>
    </linearGradient>
    <linearGradient id="centerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24416B"/>
      <stop offset="100%" stop-color="#142846"/>
    </linearGradient>
    <linearGradient id="swirlTL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A496A"/>
      <stop offset="100%" stop-color="#1B3450"/>
    </linearGradient>
    <linearGradient id="swirlTR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#239BA7"/>
      <stop offset="100%" stop-color="#17757E"/>
    </linearGradient>
    <linearGradient id="swirlBL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69B3D3"/>
      <stop offset="100%" stop-color="#4192B9"/>
    </linearGradient>
    <linearGradient id="swirlBR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3FA674"/>
      <stop offset="100%" stop-color="#277C52"/>
    </linearGradient>
  </defs>

  <!-- Central Circular Community Emblem -->
  <g transform="translate(512, 350)">
    <!-- Swirling Community Figures -->
    <!-- Top-Left Figure -->
    <circle cx="-190" cy="-155" r="42" fill="url(#swirlTL)"/>
    <path d="M -195 -100 C -225 -30 -210 60 -150 120 C -180 50 -185 -40 -140 -115 C -155 -125 -180 -115 -195 -100 Z" fill="url(#swirlTL)"/>
    <path d="M -150 -130 C -80 -215 30 -225 100 -200 C 20 -200 -60 -170 -120 -110 Z" fill="url(#swirlTL)" opacity="0.9"/>

    <!-- Top-Right Figure -->
    <circle cx="160" cy="-145" r="42" fill="url(#swirlTR)"/>
    <path d="M 120 -120 C 195 -60 220 30 190 120 C 190 40 165 -40 100 -100 Z" fill="url(#swirlTR)"/>
    <path d="M 175 -85 C 220 0 215 100 150 175 C 190 110 185 20 140 -60 Z" fill="url(#swirlTR)" opacity="0.85"/>

    <!-- Bottom-Left Figure -->
    <circle cx="-185" cy="140" r="42" fill="url(#swirlBL)"/>
    <path d="M -160 100 C -120 180 -20 225 70 210 C -20 195 -95 160 -140 85 Z" fill="url(#swirlBL)"/>
    <path d="M -180 70 C -200 130 -160 200 -80 230 C -140 195 -170 140 -160 80 Z" fill="url(#swirlBL)" opacity="0.9"/>

    <!-- Bottom-Right Figure -->
    <circle cx="160" cy="155" r="42" fill="url(#swirlBR)"/>
    <path d="M 140 115 C 80 195 -10 220 -100 200 C -15 190 60 160 120 90 Z" fill="url(#swirlBR)"/>
    <path d="M 175 100 C 195 150 160 215 90 235 C 145 205 170 160 160 105 Z" fill="url(#swirlBR)" opacity="0.85"/>

    <!-- Inner Dark Circle Background -->
    <circle cx="0" cy="0" r="148" fill="url(#centerBg)"/>

    <!-- Red Medical Cross -->
    <path d="M -30 -90 L 30 -90 L 30 -30 L 90 -30 L 90 30 L 30 30 L 30 90 L -30 90 L -30 30 L -90 30 L -90 -30 L -30 -30 Z" fill="url(#crossGrad)"/>
  </g>

  <!-- DoctorNect Wordmark -->
  <g id="wordmark" transform="translate(512, 700)" text-anchor="middle">
    <text font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="124" font-weight="800" letter-spacing="-2">
      <tspan fill="#1E3A5F" dx="-10">Doctor</tspan>
      <tspan fill="#349668">Nect</tspan>
    </text>
  </g>
</svg>
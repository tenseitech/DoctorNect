<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="marsBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="venusPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
  </defs>
  <!-- Mars Symbol (Male - Blue top right) -->
  <g stroke="url(#marsBlue)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="280" cy="220" r="75"/>
    <line x1="335" y1="165" x2="410" y2="90"/>
    <polyline points="355,90 410,90 410,145"/>
  </g>
  <!-- Venus Symbol (Female - Pink bottom left) -->
  <g stroke="url(#venusPink)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="210" cy="270" r="75"/>
    <line x1="210" y1="345" x2="210" y2="440"/>
    <line x1="170" y1="395" x2="250" y2="395"/>
  </g>
</svg>
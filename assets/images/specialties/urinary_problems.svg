<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="uriBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="kidneyRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>
  <!-- Circular Rim Badge -->
  <circle cx="250" cy="250" r="195" fill="url(#uriBg)" stroke="#3B82F6" stroke-width="18"/>
  <!-- Left Kidney -->
  <path d="M 160 140 C 200 140 210 190 190 230 C 170 270 130 250 130 200 C 130 160 140 140 160 140 Z" fill="url(#kidneyRed)"/>
  <!-- Right Kidney -->
  <path d="M 340 140 C 300 140 290 190 310 230 C 330 270 370 250 370 200 C 370 160 360 140 340 140 Z" fill="url(#kidneyRed)"/>
  <!-- Ureters (tubes to bladder) -->
  <path d="M 180 220 C 180 300 225 310 235 340" fill="none" stroke="#F87171" stroke-width="12" stroke-linecap="round"/>
  <path d="M 320 220 C 320 300 275 310 265 340" fill="none" stroke="#F87171" stroke-width="12" stroke-linecap="round"/>
  <!-- Bladder -->
  <ellipse cx="250" cy="360" rx="55" ry="45" fill="url(#kidneyRed)"/>
  <ellipse cx="250" cy="355" rx="36" ry="26" fill="#FBBF24"/>
  <!-- Pain flashes (lightning sparks) -->
  <polygon points="340,310 360,330 345,335 370,360 335,345 345,340" fill="#EF4444"/>
</svg>
# Low-RAM build profile (~7 GB system RAM). Close other apps before building.
# Release R8 minification needs >1 GB heap; debug builds can survive on less.
# Metaspace must stay >=512m or Kotlin plugin compile fails (InvocationTargetException).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Xss512k -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=true
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m
android.useAndroidX=true
# Flutter migrator flags (AGP 8.x). AGP 9+ requires a newer Flutter SDK — see build notes.
android.builtInKotlin=false
android.newDsl=false

# Windows cross-drive workaround: Pub cache lives on C: while this repo is often on D:.
# Kotlin incremental compilation cannot relativize paths across drive roots and fails with
# "this and base files have different roots" (share_plus, url_launcher_android, etc.).
kotlin.incremental=false
kotlin.incremental.android=false
